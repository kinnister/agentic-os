<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS — role-based setup guides</title>
<meta name="description" content="Set up Agentic OS for your role: governed AI inside Cursor or Claude Code. Per-role install guides for developers, QA, BA/PO, architects, DevOps, PM and portfolio managers — plus an MCP path for any other assistant.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%23161826' stroke='%239184d9' stroke-width='2'/%3E%3Ccircle cx='12' cy='13' r='2.2' fill='%239184d9'/%3E%3Ccircle cx='20' cy='13' r='2.2' fill='%239184d9'/%3E%3Cpath d='M11 21h10' stroke='%239184d9' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { margin: 0; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-300); }
  @keyframes viewin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .viewin { animation: viewin 0.35s ease; }
  /* segmented-control buttons (editor / detail / OS toggles) */
  .seg-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; background: transparent; border: none; color: var(--color-text); font-family: inherit; }
  .seg-btn.on { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
  /* gallery card hover lift */
  .role-card { transition: box-shadow 0.15s, transform 0.15s; }
  .role-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .banner-card:hover { box-shadow: var(--shadow-md); }
  /* checked-off checklist items */
  .check-label span.done { opacity: 0.5; text-decoration: line-through; }
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">
  <nav class="nav" style="max-width:1060px;margin:0 auto;padding-top:16px">
    <a href="#" class="nav-brand" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <span style="width:26px;height:26px;border:1px solid var(--color-accent);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--color-accent)"><i class="ph ph-circuitry" style="font-size:15px"></i></span>
      Agentic OS
    </a>
    <a href="#">Roles</a>
    <a href="#mcp">MCP</a>
    <a href="https://github.com/kinnister/agentic-os" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px"><i class="ph ph-github-logo"></i> GitHub</a>
  </nav>

  <div id="view"></div>

  <footer style="max-width:1060px;margin:0 auto;padding:26px 22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent) no-repeat top / 100% 1px">
    <span class="text-muted" style="font-size:12px">Agentic OS · role-based setup guides · presets are additive — re-run /agentic-init to add a role</span>
    <span style="display:inline-flex;align-items:center;gap:16px">
      <a href="https://kinnister.github.io/portfolio/" target="_blank" rel="noopener" style="font-size:12px;display:inline-flex;align-items:center;gap:5px"><i class="ph ph-briefcase"></i> Portfolio</a>
      <a href="https://github.com/kinnister/agentic-os" target="_blank" rel="noopener" style="font-size:12px;display:inline-flex;align-items:center;gap:5px"><i class="ph ph-github-logo"></i> kinnister/agentic-os</a>
    </span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
