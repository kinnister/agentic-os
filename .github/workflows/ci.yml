name: ci

# Gates every pull request into main. Branch protection requires this check to
# pass before merge, so a red run blocks the PR.
on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` beyond the defaults, because the changelog gate can
    # be waived with the `no-changelog` label. A label change raises no event by
    # default, and re-running a finished run replays the original payload — so
    # without these, applying the label leaves the PR red with no way to clear
    # it short of an empty commit.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog gate diffs against the PR base, which a
      # shallow clone has no merge base for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hook unit tests (t0)
        run: |
          bash tests/t0/run.sh
          bash tests/t0/run-output-contract.sh

      - name: Acceptance matrix (T1–T8)
        run: bash tests/run-matrix.sh

      - name: Frozen evaluation definitions and offline reliability checks
        run: python3 -m unittest discover -s tests/reliability -p 'test_*.py'

      - name: Canonical runtime contracts and bundle parity
        run: |
          python3 -m unittest discover -s tests/runtime -p 'test_*.py'
          python3 runtime/generate_bundles.py --check

      # Six suites below exist, pass, and were invoked by no automation at
      # all until now. Not hypothetical: validate-presets.sh has a prior
      # recorded incident (CHANGELOG.md) where it silently failed on all
      # seven presets, undetected, for exactly this reason.

      - name: SDLC stage-guard hook tests
        run: bash plugins/agentic-sdlc/hooks/test-sdlc-stage-guard

      - name: Ticket-sync hook tests
        run: bash plugins/agentic-sdlc/hooks/test-ticket-sync

      - name: Usage-sampler hook tests
        run: bash plugins/agentic-sdlc/hooks/test-usage-sampler

      - name: Cursor plugin packaging check
        run: python3 tests/cursor/check-cursor-packaging.py

      # TARGET is always set explicitly here, even though the script's own
      # fallback is now set -e-safe (see the commit that fixed it) — CI never
      # relies on the fallback path regardless.
      - name: Cursor e2e install smoke test
        run: |
          TARGET="${{ runner.temp }}/cursor-fresh-install" \
            bash tests/cursor/run-cursor-e2e.sh

      - name: Role preset validation
        run: bash plugins/agentic-os/presets/validate-presets.sh

      # The script itself has no formal assertions -- it relies on `set -e`
      # plus a human reading the echoed output. The grep below is what turns
      # "didn't crash" into "produced the expected terminal output."
      - name: QA e2e generator smoke test
        run: |
          bash plugins/agentic-sdlc/skills/qa-e2e-generator/scripts/qa-e2e-smoke-test.sh \
            | tee /tmp/qa-e2e-smoke.log
          grep -qx 'SMOKE TEST PASSED' /tmp/qa-e2e-smoke.log

      - name: Validate JSON manifests & presets
        run: python3 tests/lib/check-manifests.py

      - name: Skill contract check
        run: python3 tests/lib/check-skill-contract.py

      - name: Agent contract check
        run: python3 tests/lib/check-agent-contract.py

      # The QE blueprint index in qe-blueprints/SKILL.md is a hand-maintained
      # view of references/catalog/. Same posture as the MCP content index: the
      # derived copy may exist, but it fails CI when it drifts.
      - name: QE catalog index check
        run: python3 tests/lib/check-qe-catalog.py

      - name: Rule-provenance marker check
        run: |
          python3 tests/lib/check-rule-markers.py --self-test
          python3 tests/lib/check-rule-markers.py

      # A plugin's shipped content may not change without a changelog entry —
      # users install what is on main and the changelog is the only place they
      # learn what moved. The self-test runs everywhere; the diff itself needs a
      # base ref, so it is pull_request-only. Apply the `no-changelog` label for
      # a change a user genuinely cannot observe.
      - name: Changelog entry for plugin changes
        run: python3 tests/lib/check-changelog.py --self-test

      - name: Changelog entry required (PR)
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: python3 tests/lib/check-changelog.py --base "origin/${{ github.base_ref }}"

      - name: Neutrality & PII scan
        run: |
          python3 tests/lib/check-neutrality.py --self-test
          python3 tests/lib/check-neutrality.py

      - name: Run-artifact schema check
        run: python3 tests/lib/check-schemas.py

      - name: Role-tier map drift check
        run: |
          python3 tests/lib/check-role-tier-map.py --self-test
          python3 tests/lib/check-role-tier-map.py

      - name: Telemetry allowlist check
        run: |
          python3 tests/lib/check-telemetry-allowlist.py --self-test
          python3 tests/lib/check-telemetry-allowlist.py

      - name: Shipped HTML references resolve
        run: |
          python3 tests/lib/check-html-refs.py --self-test
          python3 tests/lib/check-html-refs.py

      # A cross-file markdown anchor that never existed survives a full rename
      # sweep silently — nothing else in this repo dereferences #fragments.
      - name: Doc links resolve
        run: |
          python3 tests/lib/check-doc-links.py --self-test
          python3 tests/lib/check-doc-links.py

      # Names are what hold the package together — presets claim skills by name,
      # the registry routes by name, and one skill hands off to another in prose.
      # Nothing resolved those names until this check existed.
      - name: Skill cross-references resolve
        run: |
          python3 tests/lib/check-skill-refs.py --self-test
          python3 tests/lib/check-skill-refs.py

      # Separate step so the failure reads "a rename is incomplete" rather than
      # "a reference dangles". Matches bare substrings, including in prose the
      # check above deliberately ignores.
      - name: Retired names appear nowhere
        run: python3 tests/lib/check-skill-refs.py --banned-names

      # Originality check. The corpus and its fingerprint store are local to a
      # maintainer's machine and never committed, so a runner cannot repeat the
      # scan — it enforces the recorded result instead. --verify-attestation
      # needs no store and fails if any tracked text file drifted from the tree
      # that was last scanned clean, which is what makes this a real gate rather
      # than a no-op. The bare scan still runs, and still skips on a runner.
      - name: Originality check
        run: |
          python3 tests/lib/check-provenance.py --self-test
          python3 tests/lib/check-provenance.py --verify-attestation
          python3 tests/lib/check-provenance.py

  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        working-directory: mcp
        run: npm ci

      # Runs before the build: catches a plugin edit whose author forgot to
      # regenerate the index, which is the drift failure we actually fear.
      - name: Content drift check
        working-directory: mcp
        run: npm run check:drift

      - name: Build
        working-directory: mcp
        run: npm run build

      - name: Contract, content, and read-only tests
        working-directory: mcp
        run: npm test

      # Version pinned deliberately so an upstream release cannot turn an unrelated PR red.
      # Should be bumped intentionally when upgrading the Inspector CLI.
      - name: Inspector CLI smoke
        working-directory: mcp
        run: |
          npx --yes @modelcontextprotocol/inspector@1.0.0 --cli node dist/index.js --method tools/list
          npx --yes @modelcontextprotocol/inspector@1.0.0 --cli node dist/index.js --method resources/list
          npx --yes @modelcontextprotocol/inspector@1.0.0 --cli node dist/index.js --method prompts/list
